let state={lang:'de',category:'all',free:false,ads:false,q:'',large:false};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function fold(s){return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').toLowerCase().trim()}
function localized(i){return i[state.lang]||i.de}
function searchable(i){return fold([i.de?.title,i.de?.summary,i.de?.meta,i.en?.title,i.en?.summary,i.en?.meta,i.ru?.title,i.ru?.summary,i.ru?.meta,i.location,i.page,i.date,i.time,i.category,i.type].join(' '))}
function matches(i){
 if(i.ad&&!state.ads)return false;
 if(state.category!=='all'&&!i.category.split(',').includes(state.category))return false;
 if(state.free&&!i.free)return false;
 const terms=fold(state.q).split(/\s+/).filter(Boolean);
 const hay=searchable(i);
 return terms.every(t=>hay.includes(t));
}
function formatDate(s){if(!s)return ''; const d=new Date(s+'T12:00:00'); return new Intl.DateTimeFormat(state.lang==='ru'?'ru-RU':state.lang==='en'?'en-GB':'de-DE',{weekday:'short',day:'numeric',month:'long',year:'numeric'}).format(d)}
function ics(i){if(!i.date)return; const l=localized(i); const clean=x=>(x||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'); const dt=i.date.replaceAll('-',''); const content=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Mein Mitteilungsblatt//Private Project//DE','BEGIN:VEVENT','UID:'+i.id+'-2026@mein-mitteilungsblatt.local','DTSTART;VALUE=DATE:'+dt,'SUMMARY:'+clean(l.title),'LOCATION:'+clean(i.location),'DESCRIPTION:'+clean(l.summary+' | '+l.meta),'END:VEVENT','END:VCALENDAR'].join('\r\n'); const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/calendar'}));a.download=i.id+'.ics';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function speak(i){speechSynthesis.cancel(); const l=localized(i); const u=new SpeechSynthesisUtterance(l.title+'. '+l.summary+'. '+l.meta);u.lang=state.lang==='ru'?'ru-RU':state.lang==='en'?'en-GB':'de-DE';speechSynthesis.speak(u)}
function toggleSave(id){let s=new Set(JSON.parse(localStorage.getItem('savedItems')||'[]'));s.has(id)?s.delete(id):s.add(id);localStorage.setItem('savedItems',JSON.stringify([...s]));render()}
function card(i){const l=localized(i), saved=new Set(JSON.parse(localStorage.getItem('savedItems')||'[]')).has(i.id); const date=[formatDate(i.date),i.time].filter(Boolean).join(' · '); const t=UI[state.lang]; const art=document.createElement('article');art.className='card'+(saved?' saved':'');art.innerHTML=`<div class="kicker">${i.type==='official'?'◆':i.ad?'AD':'●'} ${i.type.toUpperCase()} · S. ${i.page}</div><h2>${l.title}</h2>${date?`<div class="meta">${date}</div>`:''}<div class="loc">${i.location}</div><p>${l.summary}</p><div class="price">${l.meta}</div><div class="actions"><button class="btn read">🔊 ${t.read}</button>${i.date?`<button class="btn cal">＋ ${t.calendar}</button>`:''}<button class="btn save">${saved?'★':'☆'} ${t.save}</button></div><details><summary>${t.details}</summary><div class="source">${t.source} ${i.page}</div></details>`; art.querySelector('.read').onclick=()=>speak(i); const c=art.querySelector('.cal');if(c)c.onclick=()=>ics(i); art.querySelector('.save').onclick=()=>toggleSave(i.id); return art}
function render(){const t=UI[state.lang];document.documentElement.lang=state.lang;$('#lang').value=state.lang;$('#bigText').textContent=t.bigger;$('#shareBtn').textContent=t.share;$('#privateLabel').textContent=t.private;$('#noticeText').textContent=t.notice;$('#issue').textContent=t.issue;$('#hero').textContent=t.hero;$('#sub').textContent=t.sub;$('#search').placeholder=t.search;$('#searchhelp').textContent=t.searchhelp;$('#freeLabel').textContent=t.free;$('#adsLabel').textContent=t.ads;$('#resetBtn').textContent=t.reset;$('#resultsLabel').textContent=t.results;$('#footerPrivate').textContent=t.private;$('#footerNotice').textContent=t.notice;$('#about').textContent=t.about;document.body.classList.toggle('large',state.large);
 const cats=[['all',t.all],['family',t.family],['elderly',t.elderly],['culture',t.culture],['service',t.service],['official',t.official]];const cf=$('#categoryFilters');cf.innerHTML='';for(const [id,label] of cats){const b=document.createElement('button');b.className='chip'+(state.category===id?' active':'');b.textContent=label;b.onclick=()=>{state.category=id;render()};cf.appendChild(b)}
 $('#freeOnly').checked=state.free;$('#showAds').checked=state.ads;const arr=ITEMS.filter(matches);$('#count').textContent=arr.length;const cards=$('#cards');cards.innerHTML='';if(!arr.length){const e=document.createElement('div');e.className='empty';e.textContent=t.noresults;cards.appendChild(e)}else arr.forEach(i=>cards.appendChild(card(i)))}
$('#lang').addEventListener('change',e=>{state.lang=e.target.value;render()});$('#bigText').addEventListener('click',()=>{state.large=!state.large;render()});$('#shareBtn').addEventListener('click',async()=>{try{await navigator.share({title:document.title,url:location.href})}catch(e){try{await navigator.clipboard.writeText(location.href);alert('Link copied / Link kopiert')}catch(_){}}});$('#search').addEventListener('input',e=>{state.q=e.target.value;render()});$('#freeOnly').addEventListener('change',e=>{state.free=e.target.checked;render()});$('#showAds').addEventListener('change',e=>{state.ads=e.target.checked;render()});$('#resetBtn').addEventListener('click',()=>{state={...state,category:'all',free:false,ads:false,q:''};$('#search').value='';render()});
render();
</script>
