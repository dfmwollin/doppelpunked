<style>

  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:2px; }

  /* rivet / bolt corner decoration */
  .rivet::before, .rivet::after{
    content:''; position:absolute; width:5px; height:5px; border-radius:50%;
    background:#3a4150; box-shadow: inset 0 1px 1px rgba(0,0,0,.6), 0 0 0 1px #0d0f13;
  }
  .rivet::before{ top:8px; left:8px; }
  .rivet::after{ top:8px; right:8px; }

  /* switch-style tab */
  .switch-tab{
    position:relative;
    border:1px solid var(--line);
    background:linear-gradient(180deg,#20252D,#171B21);
    transition:all .15s ease;
  }
  .switch-tab[aria-selected="true"]{
    background:linear-gradient(180deg,#132a17,#0f1c11);
    border-color:#1f7a2e;
    box-shadow: 0 0 0 1px #1f7a2e40, 0 4px 14px -6px rgba(57,255,20,.35);
  }
  .switch-tab[aria-selected="true"] .switch-led{
    background:var(--accent);
    box-shadow:0 0 8px 2px rgba(57,255,20,.7);
  }
  .switch-led{
    width:7px; height:7px; border-radius:50%;
    background:#3a4150;
    transition:all .15s ease;
  }

  input[type=range]{
    -webkit-appearance:none; appearance:none;
    height:6px; border-radius:3px;
    background:linear-gradient(90deg,var(--accent) var(--fill,50%), #2C323C var(--fill,50%));
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:18px; height:18px; border-radius:3px;
    background:#0d0f13; border:2px solid var(--accent);
    cursor:pointer; margin-top:0;
  }
  input[type=range]::-moz-range-thumb{
    width:16px; height:16px; border-radius:3px;
    background:#0d0f13; border:2px solid var(--accent); cursor:pointer;
  }

  select, .fake-select{
    background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
  }
  select:focus, button:focus-visible, .switch-tab:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  .gauge-track{ stroke:#2C323C; }
  .gauge-fill{ stroke:var(--accent); transition:stroke-dashoffset .5s ease; }

  .tick-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em; color:var(--ink-dim); text-transform:uppercase; }

  .fade-in{ animation: fadeIn .35s ease both; }

/* =========================================================
   ROI CALCULATIONS
========================================================= */
function computeROI({ capex, reps, cycleDays }) {
  const softCostLow = capex * 0.5;
  const softCostMid = capex * 1.0;
  const softCostHigh = capex * 1.5;

  const newCycleDays = Math.max(cycleDays / 5, cycleDays * (1/24)); // 5x velocity, floor near hours-scale
  const newCycleHours = newCycleDays * 8; // approx working hours per "day"

  const effectiveCapacity = reps * 3; // 3x scoping capacity multiplier

  const section179Cap = 2500000;
  const eligible = Math.min(capex, section179Cap);
  const assumedTaxRate = 0.21; // US federal corporate rate, stated as an assumption in the UI
  const taxShield = eligible * assumedTaxRate;

  const standardSalesPerMachine = 183000;
  const highPerfSalesPerMachine = 350000;
  const standardHours = 8.5;
  const highPerfHours = 15;

  return {
    softCostLow, softCostMid, softCostHigh,
    newCycleDays, newCycleHours,
    effectiveCapacity,
    eligible, taxShield, assumedTaxRate, section179Cap,
    standardSalesPerMachine, highPerfSalesPerMachine, standardHours, highPerfHours
  };
}

/* =========================================================
   GAUGE (small radial svg)
========================================================= */
function Gauge({ value, max, label, valueLabel, size=110 }){
  const r = size/2 - 10;
  const c = 2*Math.PI*r;
  const pct = Math.max(0, Math.min(1, value/max));
  const offset = c * (1-pct);
  return `
  <div class="flex flex-col items-center">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="gauge-track" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="9"/>
      <circle class="gauge-fill" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="9"
        stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${offset}"
        transform="rotate(-90 ${size/2} ${size/2})"/>
      <text x="50%" y="47%" text-anchor="middle" fill="var(--ink)" font-family="IBM Plex Mono" font-size="15" font-weight="600">${valueLabel}</text>
      <text x="50%" y="63%" text-anchor="middle" fill="var(--ink-dim)" font-family="IBM Plex Mono" font-size="8" letter-spacing="1">${label}</text>
    </svg>
  </div>`;
}

          <div class="flex justify-between items-baseline mb-1.5">
            <span class="text-sm font-medium">Avg. quoting cycle time</span>
            <span class="font-mono text-sm accent-text">${r.cycleDays} day${r.cycleDays==1?'':'s'}</span>
          </div>
          <input type="range" min="1" max="28" step="1" value="${r.cycleDays}"
            style="--fill:${((r.cycleDays-1)/(28-1))*100}%"
            oninput="updateROI('cycleDays', this.value)">
          <div class="flex justify-between tick-label mt-1"><span>1 day</span><span>4 weeks</span></div>
        </div>

        <div class="pt-4 border-t hairline">
          <div class="tick-label mb-2">Grounding assumptions</div>
          <ul class="text-xs space-y-1.5" style="color:var(--ink-dim)">
            <li>Hardware ≈ 30% of project cost; soft costs ≈ 70% and rising</li>
            <li>Soft-cost multiplier: $0.50–$1.50 per $1 of CapEx (mid = $1.00 shown as default)</li>
            <li>Section 179 cap: ${fmtUSD(calc.section179Cap)}, 100% bonus depreciation</li>
            <li>Tax shield assumes a ${(calc.assumedTaxRate*100).toFixed(0)}% effective rate — confirm with the prospect's tax advisor</li>
          </ul>
        </div>
      </div>

      <!-- OUTPUTS -->
      <div class="space-y-5">

        <!-- soft costs -->
        <div class="panel rounded-sm p-5 relative rivet">
          <div class="tick-label mb-3">Hidden Soft Costs — The Cost Inversion</div>
          <div class="grid grid-cols-3 gap-3">
            <div class="panel-2 rounded-sm p-3 text-center">
              <div class="tick-label mb-1">Low ($0.50/$1)</div>
              <div class="font-mono text-lg font-semibold">${fmtUSD(calc.softCostLow)}</div>
            </div>
            <div class="panel-2 rounded-sm p-3 text-center border" style="border-color:var(--accent)">
              <div class="tick-label mb-1 accent-text">Default ($1.00/$1)</div>
              <div class="font-mono text-xl font-bold accent-text">${fmtUSD(calc.softCostMid)}</div>
            </div>
            <div class="panel-2 rounded-sm p-3 text-center">
              <div class="tick-label mb-1">High ($1.50/$1)</div>
              <div class="font-mono text-lg font-semibold">${fmtUSD(calc.softCostHigh)}</div>
            </div>
          </div>
          <p class="text-xs mt-3" style="color:var(--ink-dim)">For every dollar spent on ${fmtUSD(r.capex)} of hardware, this shop is likely absorbing an equivalent (or larger) amount in manual engineering translation — scoping, custom quoting, and escalations.</p>
        </div>

        <!-- gauges -->
        <div class="panel rounded-sm p-5 relative rivet">
          <div class="tick-label mb-4">Bardin Backlog Acceleration</div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            ${Gauge({ value:5, max:5, label:"DEAL VELOCITY", valueLabel:"5×" })}
            ${Gauge({ value:10, max:10, label:"TICKET RESOLUTION", valueLabel:"10×" })}
            ${Gauge({ value:3, max:3, label:"SCOPING CAPACITY", valueLabel:"3×" })}
            ${Gauge({ value:calc.newCycleDays, max:r.cycleDays, label:"NEW CYCLE (DAYS)", valueLabel:calc.newCycleDays<1 ? calc.newCycleHours.toFixed(1)+"h" : calc.newCycleDays.toFixed(1) })}
          </div>
          <div class="grid md:grid-cols-2 gap-3 mt-4 pt-4 border-t hairline text-sm">
            <div class="flex items-center gap-2"><i data-lucide="zap" class="w-4 h-4 accent-text"></i>Quoting cycle: <span class="font-mono steel-text">${r.cycleDays}d → ${calc.newCycleDays<1 ? calc.newCycleHours.toFixed(1)+"h" : calc.newCycleDays.toFixed(1)+"d"}</span></div>
            <div class="flex items-center gap-2"><i data-lucide="users" class="w-4 h-4 accent-text"></i>Effective scoping capacity: <span class="font-mono steel-text">${r.reps} → ${calc.effectiveCapacity} reps-equivalent</span></div>
          </div>
        </div>

        <!-- tax shield + OT leap -->
        <div class="grid md:grid-cols-2 gap-5">
          <div class="panel rounded-sm p-5 relative rivet">
            <div class="tick-label mb-2">Section 179 Capital Shield</div>
            <div class="font-mono text-3xl font-bold accent-text">${fmtUSD(calc.taxShield)}</div>
            <p class="text-xs mt-2" style="color:var(--ink-dim)">Immediate depreciation savings on ${fmtUSD(calc.eligible)} of eligible CapEx at an assumed ${(calc.assumedTaxRate*100).toFixed(0)}% effective tax rate.</p>
          </div>
          <div class="panel rounded-sm p-5 relative rivet">
            <div class="tick-label mb-2">OT Productivity Leap (per machine)</div>
            <div class="flex items-end justify-between">
              <div>
                <div class="tick-label">Standard shop</div>
                <div class="font-mono text-lg">${fmtUSD(calc.standardSalesPerMachine)} / ${calc.standardHours}h</div>
              </div>
              <i data-lucide="arrow-right" class="w-5 h-5 steel-text"></i>
              <div class="text-right">
                <div class="tick-label">High-performing unattended</div>
                <div class="font-mono text-lg accent-text">${fmtUSD(calc.highPerfSalesPerMachine)} / ${calc.highPerfHours}h</div>
              </div>
            </div>
          </div>
        </div>

        <div class="flex justify-end">
          <button class="no-print flex items-center gap-2 px-4 py-2.5 rounded-sm text-sm font-semibold panel-2 hover:border-green-400 transition" style="border:1px solid var(--accent); color:var(--accent)" onclick="setTab('playbook')">
            Build full playbook <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>
  </div>`;
}

/* =========================================================
   TAB 3 — PLAYBOOK / PITCH BRIEF
========================================================= */
const ROADMAP = [
  { range: "Weeks 1–4", title: "Identify Internal Bottlenecks", detail: "Baseline the shop's \u201cPeopleware\u201d — map where scoping, quoting, and escalations actually consume engineering hours today." },
  { range: "Weeks 5–8", title: "Map Technology Solutions", detail: "Shortlist sector exhibitors against the mapped bottleneck. Prioritize registration ahead of the Aug 1st early-bird deadline." },
  { range: "Weeks 9–11", title: "Finalize the Game Plan", detail: "Lock the IMTS Show Planner: confirmed meetings, booth walk order, and internal owners per stop." },
  { range: "Week 12", title: "Divide & Conquer", detail: "Assign floor tracks across the team so every sector on the map gets covered without duplicated effort." }
];

function PlaybookTab(){
  const a = state.analyzer;
  const r = state.roi;
  const persona = DATA.imts2026.personas[a.persona];
  const bottleneck = BOTTLENECKS.find(b => b.id === a.bottleneck);
  const sector = byId(bottleneck.sector);
  const calc = computeROI(r);
  const pillarLabel = { vault:"Bardin Vault", chat:"Bardin Chat", tools_agents:"Bardin Tools & Agents", ontology:"Bardin Ontology" }[bottleneck.pillar];

  return `
  <div class="max-w-7xl mx-auto px-5 md:px-8 py-8 fade-in">

    <div class="no-print flex justify-end mb-4 gap-2">
      <button class="flex items-center gap-2 px-4 py-2.5 rounded-sm text-sm font-semibold panel-2" style="border:1px solid var(--steel); color:var(--steel)" onclick="window.print()">
        <i data-lucide="printer" class="w-4 h-4"></i> Export to PDF
      </button>
    </div>

    <div class="panel print-area rounded-sm p-6 md:p-10 relative rivet">
      <div class="flex items-start justify-between flex-wrap gap-4 border-b hairline pb-5 mb-6">
        <div>
          <div class="tick-label mb-1">GTM Persona Pitch &amp; Playbook</div>
          <div class="font-display text-3xl md:text-4xl font-bold">${persona.title}</div>
        </div>
        <div class="text-right tick-label">
          <div>${DATA.imts2026.venue}</div>
          <div>${DATA.imts2026.dates}</div>
        </div>
      </div>

      <!-- pitch -->
      <div class="mb-6">
        <div class="tick-label mb-2">The pitch</div>
        <p class="text-lg leading-relaxed italic panel-2 rounded-sm p-4 border-l-4" style="border-left-color:var(--accent)">"${persona.pitch}"</p>
      </div>

      <!-- gap summary -->
      <div class="grid md:grid-cols-2 gap-5 mb-6">
        <div class="panel-2 rounded-sm p-4">
          <div class="tick-label mb-2">Mapped gap</div>
          <p class="text-sm mb-2"><span class="font-semibold">Bottleneck:</span> ${bottleneck.label}</p>
          <p class="text-sm mb-2"><span class="font-semibold">Sector:</span> ${sector.name} — ${sector.building}, ${sector.level}</p>
          <p class="text-sm"><span class="font-semibold">Closed by:</span> ${pillarLabel}</p>
        </div>
        <div class="panel-2 rounded-sm p-4">
          <div class="tick-label mb-2">Must-see exhibitors</div>
          <div class="flex flex-wrap gap-1.5">
            ${sector.key_exhibitors.map(e => `<span class="rounded-sm px-2 py-1 text-xs font-mono panel">${e}</span>`).join("")}
          </div>
        </div>
      </div>

      <!-- roi summary -->
      <div class="mb-6">
        <div class="tick-label mb-2">Financial model summary</div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="panel-2 rounded-sm p-3 text-center">
            <div class="tick-label mb-1">CapEx modeled</div>
            <div class="font-mono text-base font-semibold">${fmtUSD(r.capex)}</div>
          </div>
          <div class="panel-2 rounded-sm p-3 text-center">
            <div class="tick-label mb-1">Hidden soft cost</div>
            <div class="font-mono text-base font-semibold accent-text">${fmtUSD(calc.softCostMid)}</div>
          </div>
          <div class="panel-2 rounded-sm p-3 text-center">
            <div class="tick-label mb-1">Tax shield (Sec. 179)</div>
            <div class="font-mono text-base font-semibold">${fmtUSD(calc.taxShield)}</div>
          </div>
          <div class="panel-2 rounded-sm p-3 text-center">
            <div class="tick-label mb-1">Quoting cycle</div>
            <div class="font-mono text-base font-semibold steel-text">${r.cycleDays}d → ${calc.newCycleDays<1 ? calc.newCycleHours.toFixed(1)+"h" : calc.newCycleDays.toFixed(1)+"d"}</div>
          </div>
        </div>
      </div>

      <!-- roadmap -->
      <div>
        <div class="tick-label mb-3">12-Week Preparation &amp; Implementation Roadmap</div>
        <div class="space-y-3">
          ${ROADMAP.map((step, i) => `
            <div class="flex gap-4 panel-2 rounded-sm p-4">
              <div class="font-mono text-sm shrink-0 w-24 accent-text font-semibold">${step.range}</div>
              <div>
                <div class="font-semibold text-sm mb-0.5">${step.title}</div>
                <div class="text-sm" style="color:var(--ink-dim)">${step.detail}</div>
              </div>
            </div>
          `).join("")}
        </div>
      </div>

      <div class="mt-8 pt-5 border-t hairline text-xs" style="color:var(--ink-dim)">
        ${DATA.bardin_platform.rebrand_context.philosophy}
      </div>
    </div>
  </div>`;
}

/* =========================================================
   APP SHELL
========================================================= */
function render(){
  const body = state.tab === "analyzer" ? AnalyzerTab()
             : state.tab === "roi" ? ROITab()
             : PlaybookTab();
  document.getElementById("app").innerHTML = Header() + TabNav() + body;
  renderIcons();
}

function setTab(id){ state.tab = id; render(); }
function updateAnalyzer(key, val){ state.analyzer[key] = val; render(); }
function updateROI(key, val){ state.roi[key] = Number(val); render(); }

window.setTab = setTab;
window.updateAnalyzer = updateAnalyzer;
window.updateROI = updateROI;

render();
</script>
</body>
</html>
